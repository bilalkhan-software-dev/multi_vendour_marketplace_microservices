services:

  seller-service-postgres:
    image: postgres:15
    container_name: seller-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seller-service-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: khan
    ports:
      - "5433:5433"
    command: postgres -p 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # seller service
  seller-service:
    image: bilalkhandevse/microservices-vendormarketplace-seller-service:latest
    container_name: seller-service
    environment:
      SPRING_PROFILE_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:2007
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:9092,kafka-broker-2:9093
      EUREKA_SERVER_URL: http://eureka-server:8761
      DB_HOST: user-service-postgres
    ports:
      - "8081:8081"
    depends_on:
      - seller-service-postgres
    networks:
      - vendor-marketplace-microservices-network

volumes:
  postgres_data: