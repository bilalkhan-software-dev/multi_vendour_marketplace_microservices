services:
  postgres:
    image: postgres:15
#    container_name: microservice-vendor_marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seller-service-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: khan
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge