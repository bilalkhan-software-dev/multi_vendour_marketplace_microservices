services:
  mongodb:
    image: mongo:8.0
    container_name: home-service_mongodb
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: home-service-db
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: