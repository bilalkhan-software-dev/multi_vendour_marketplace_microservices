services:

  home-service-mongodb:
    image: mongo:8.0
    container_name: home-service-mongodb
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: home-service-db
    volumes:
      - home_mongodb_data:/data/db

volumes:
  home_mongodb_data: