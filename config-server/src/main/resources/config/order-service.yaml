spring:
  kafka:
    bootstrap-servers: localhost:29092,localhost:29093
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5435/order-service-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:khan}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true

feign:
  client:
    user-service:
      url:  http://USER-SERVICE
    cart-service:
      url:  http://CART-SERVICE





eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8088