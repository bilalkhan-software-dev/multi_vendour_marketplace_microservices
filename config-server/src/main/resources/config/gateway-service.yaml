spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v2/auth/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v2/user/**

            - id: seller-service
              uri: lb://SELLER-SERVICE
              predicates:
                - Path=/api/v2/seller/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 2008

