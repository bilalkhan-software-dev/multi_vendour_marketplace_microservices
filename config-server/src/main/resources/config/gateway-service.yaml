spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v2/auth/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v2/user/**

            - id: seller-service
              uri: lb://SELLER-SERVICE
              predicates:
                - Path=/api/v2/seller/**

            - id: product-command-service
              uri: lb://PRODUCT-COMMAND-SERVICE
              predicates:
                - Path=/api/v2/products/command/**

            - id: product-query-service
              uri: lb://PRODUCT-QUERY-SERVICE
              predicates:
                - Path=/api/v2/products/**

            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/v2/carts/**

            - id: transaction-report-service
              uri: lb://TRANSACTION-REPORT-SERVICE
              predicates:
                - Path=/api/v2/transactions/**
                - Path=/api/v2/admin/tr/**
                - Path=/api/v2/reports/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v2/orders/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v2/payment/**,/api/v2/admin/payment/**

            - id: review-wishlist-service
              uri: lb://REVIEW-WISHLIST-SERVICE
              predicates:
                - Path=/api/v2/reviews/**,/api/v2/wishlists/**,/api/v2/admin/rw/**

            - id: home-service
              uri: lb://HOME-SERVICE
              predicates:
                - Path=/api/v2/admin/home/**,/api/v2/public/home/**


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

server:
  port: 2008

