spring:
  application:
    name: config-server
#  profiles:
#    active: native
#  cloud:
#    config:
#      server:
#        native:
#          search-locations: classpath:/config

  cloud:
    config:
      server:
        git:
          uri: https://github.com/bilalkhan-software-dev/vendor-markatplace-microservcies-config
          default-label: master
          search-paths: '{application}'
          clone-on-start: true
          force-pull: true


server:
  port: 2007



management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}