spring:
  application:
    name: product-command-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:2007}
  data:
    mongodb:
      uri: ${MONGODB_URL:mongodb://admin:password123@localhost:27017/product-command-service-db?authSource=admin}
      auto-index-creation: true
  kafka:
    bootstrap-servers:  ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:29093}
    consumer:
      group-id: product-command-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8084