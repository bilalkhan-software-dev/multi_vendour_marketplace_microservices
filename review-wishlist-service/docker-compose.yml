services:
  postgres:
    image: postgres:15
    container_name: microservice-vendor_marketplace-review-wishlist-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: review-wishlist-service-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: khan
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:

