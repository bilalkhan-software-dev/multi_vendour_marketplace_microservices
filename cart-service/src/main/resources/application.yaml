spring:
  application:
    name: cart-service
  config:
    import: optional:configserver:http://localhost:2007
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/cart-service-db}
    username: ${DB_USER:admin}
    password: ${GB_PASSWORD:1234567}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true

server:
  port: 8086