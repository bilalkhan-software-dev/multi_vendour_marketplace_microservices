apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: bilalkhandevse/microservices-vendormarketplace-config-server:latest
          ports:
            - containerPort: 2007

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: config-server-svc
spec:
  selector:
    app: config-server
  ports:
    - port: 80
      targetPort: 2007


# If your service uses port 80 (HTTP default):
#  http://service-name           # Works

# If your service uses port 443 (HTTPS default):
#  https://service-name          # Works

# If your service uses ANY OTHER PORT:
#  http://service-name:PORT      # Must specify port