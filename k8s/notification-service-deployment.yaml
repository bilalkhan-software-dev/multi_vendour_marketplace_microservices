apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: bilalkhandevse/microservices-vendormarketplace-notification-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_CONFIG_IMPORT
              valueFrom:
                configMapKeyRef:
                  name: config-cm
                  key: config_url
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: eureka-cm
                  key: eureka_server_address

            - name: EMAIL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: notification-cm
                  key: email_username
            - name: EMAIL_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: notification-cm
                  key: email_password

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
