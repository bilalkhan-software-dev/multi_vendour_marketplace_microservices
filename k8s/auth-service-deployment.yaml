apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: bilalkhandevse/microservices-vendormarketplace-auth-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_CONFIG_IMPORT
          valueFrom:
            configMapKeyRef:
              name: config-cm
              key: config_url
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: postgres-cm
              key: hostname
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: postgres-cm
              key: port
        - name: BOOTSRTAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-cm
              key: bootstrap_servers      

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-svc
spec:
  selector:
    app: auth-service
  ports:
  - port: 80
    targetPort: 8081