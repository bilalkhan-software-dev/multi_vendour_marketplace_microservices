apiVersion: v1
kind: PersistentVolume
metadata:
  name: product-command-db-mongo-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  hostPath:
    path: "/data/db"
    type: DirectoryOrCreate

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-command-db-mongo-pvc
spec:
  resources:
    requests:
      storage: 1Gi
  storageClassName: manual
  accessModes:
    - ReadWriteOnce

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: product-command-db-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-command-db-mongo
  serviceName: product-command-db-mongo-headless
  template:
    metadata:
      labels:
        app: product-command-db-mongo
    spec:
      containers:
        - name: product-command-db-mongo
          image: mongo:8.0
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: password
            - name: MONGO_INITDB_DATABASE
              value: "product-command-service-db"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: product-command-db-mongo-storage
              mountPath: /var/lib/mongo/data  # ← stores data here
      volumes:
        - name: product-command-db-mongo-storage
          persistentVolumeClaim:
            claimName: product-command-db-mongo-pvc  # ← Points to PVC

---
apiVersion: v1
kind: Service
metadata:
  name: product-command-db-mongo-headless
spec:
  clusterIP: None
  selector:
    app: product-command-db-mongo
  ports:
    - port: 27017
      targetPort: 27017

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-command-db-cm
data:
  mongodb_url: "mongodb://admin:password123@product-command-db-mongo-0.product-command-db-mongo-headless:27017/product-command-service-db?authSource=admin"
