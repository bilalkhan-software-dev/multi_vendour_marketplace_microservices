apiVersion: v1
kind: ConfigMap
metadata:
  name: config-cm
data:
  config_url: http://config-server-svc

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eureka-cm
data:
  eureka_server_address: http://eureka-0.eureka:8761/eureka/

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-cm
data:
  hostname: "mysql-0.mysql"
  port: "3306"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-cm
data:
  hostname: "postgres-0.postgres"
  port: "5432"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-cm
data:
  mongodb-url: <url>

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-cm
data:
  bootstrap_servers: "kafka-0.kafka:9092, kafka-1.kafka:9092"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cm
data:
  hostname: "redis-0.redis"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-cm
data:
  email_username: <my-username>
  email_password: <my_app_password>
