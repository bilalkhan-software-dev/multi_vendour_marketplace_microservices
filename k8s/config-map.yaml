apiVersion: v1
kind: ConfigMap
metadata:
  name: config-cm
data:
  config_url: http://config-server-svc

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-cm
data:
  hostname: "mysql-0.mysql"
  port: "3306"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-cm
data:
  hostname: "postgres-0.postgres"
  port: "5432"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-cm
data:
  bootstrap_servers: "kafka-0.kafka:9092, kafka-1.kafka:9092"

