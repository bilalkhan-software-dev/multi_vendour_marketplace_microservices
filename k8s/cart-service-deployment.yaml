apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
spec:
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: bilalkhandevse/microservices-vendormarketplace-cart-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_CONFIG_IMPORT
              valueFrom:
                configMapKeyRef:
                  name: config-cm
                  key: config_url
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mysql-cm
                  key: hostname
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mysql-cm
                  key: port

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: cart-service-svc
spec:
  selector:
    app: cart-service
  ports:
    - port: 80
      targetPort: 8085
