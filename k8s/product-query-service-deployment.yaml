apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-query-service
spec:
  selector:
    matchLabels:
      app: product-query-service
  template:
    metadata:
      labels:
        app: product-query-service
    spec:
      containers:
        - name: product-query-service
          image: bilalkhandevse/microservices-vendormarketplace-product-query-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_CONFIG_IMPORT
              valueFrom:
                configMapKeyRef:
                  name: config-cm
                  key: config_url
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: eureka-cm
                  key: eureka_server_address

            - name: MONGODB_URL
              valueFrom:
                configMapKeyRef:
                  name: mongodb-cm
                  key: mongodb-url

            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-cm
                  key: bootstrap_servers

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: product-query-service-svc
spec:
  selector:
    app: product-query-service
  ports:
    - port: 80
      targetPort: 8085
